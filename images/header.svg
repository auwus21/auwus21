<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 280" width="100%">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16"/>
      <stop offset="50%" stop-color="#0d1117"/>
      <stop offset="100%" stop-color="#111827"/>
    </linearGradient>
    <radialGradient id="glow1" cx="18%" cy="20%" r="55%">
      <stop offset="0%" stop-color="#3b82f6" stop-opacity="0.16"/>
      <stop offset="100%" stop-color="#3b82f6" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow2" cx="85%" cy="80%" r="50%">
      <stop offset="0%" stop-color="#10b981" stop-opacity="0.10"/>
      <stop offset="100%" stop-color="#10b981" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#1f2937" stop-opacity="0.4"/>
      <stop offset="35%" stop-color="#3b82f6" stop-opacity="0.5"/>
      <stop offset="65%" stop-color="#10b981" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#1f2937" stop-opacity="0.4"/>
    </linearGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M 32 0 L 0 0 0 32" fill="none" stroke="#ffffff" stroke-width="1" stroke-opacity="0.025"/>
    </pattern>
  </defs>

  <!-- Background -->
  <rect width="1200" height="280" rx="16" fill="url(#bg)"/>
  <rect width="1200" height="280" rx="16" fill="url(#grid)"/>
  <rect width="1200" height="280" rx="16" fill="url(#glow1)"/>
  <rect width="1200" height="280" rx="16" fill="url(#glow2)"/>
  <rect x="0.75" y="0.75" width="1198.5" height="278.5" rx="15.25" fill="none" stroke="url(#borderGrad)" stroke-width="1.5"/>

  <!-- Left Content -->
  <!-- Status Pill -->
  <g transform="translate(60, 52)">
    <rect width="310" height="28" rx="14" fill="#161b22" stroke="#30363d" stroke-width="1"/>
    <circle cx="16" cy="14" r="4.5" fill="#10b981"/>
    <text x="30" y="18.5" fill="#c9d1d9" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="12" font-weight="500">La Plata, AR · Lic. en Sistemas (UNLP)</text>
  </g>

  <!-- Name & Title -->
  <text x="60" y="136" fill="#f0f6fc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="46" font-weight="800" letter-spacing="-0.8">Agustín Olthoff</text>
  
  <text x="60" y="174" fill="#8b949e" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="19" font-weight="400">
    Dueño &amp; CTO en <tspan fill="#58a6ff" font-weight="600">TecStore Argentina</tspan> · Full-Stack Developer
  </text>

  <text x="60" y="214" fill="#6e7681" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="14">
    Desarrollo sistemas de gestión, e-commerce y automatización para negocios reales.
  </text>

  <!-- Right Side Decorative Terminal Card -->
  <g transform="translate(790, 44)">
    <rect width="356" height="192" rx="12" fill="#0d1117" fill-opacity="0.88" stroke="#30363d" stroke-width="1"/>
    <line x1="0" y1="32" x2="356" y2="32" stroke="#21262d" stroke-width="1"/>
    <circle cx="16" cy="16" r="5" fill="#ff5f56" fill-opacity="0.8"/>
    <circle cx="32" cy="16" r="5" fill="#ffbd2e" fill-opacity="0.8"/>
    <circle cx="48" cy="16" r="5" fill="#27c93f" fill-opacity="0.8"/>
    <text x="178" y="20" text-anchor="middle" fill="#6e7681" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="11">agustin@unlp: ~</text>

    <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12.5">
      <text x="22" y="62" fill="#58a6ff">role:</text>
      <text x="112" y="62" fill="#a5d6ff">"Co-Founder &amp; CTO"</text>

      <text x="22" y="88" fill="#58a6ff">location:</text>
      <text x="112" y="88" fill="#c9d1d9">"La Plata, AR"</text>

      <text x="22" y="114" fill="#58a6ff">frontend:</text>
      <text x="112" y="114" fill="#c9d1d9">["Next.js", "React", "TS"]</text>

      <text x="22" y="140" fill="#58a6ff">backend:</text>
      <text x="112" y="140" fill="#c9d1d9">["PostgreSQL", "Node", "Python"]</text>

      <text x="22" y="166" fill="#58a6ff">education:</text>
      <text x="112" y="166" fill="#7ee787">"Informática — UNLP"</text>
    </g>
  </g>
</svg>
